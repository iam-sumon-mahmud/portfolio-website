<!DOCTYPE html>
<html>
    <head>
        <title>
            Sumon Dev | Web Developer
        </title>
        <meta name="description" content="Sumon Mahmud | I am Web Developer, My Skills is HTML, CSS, JAVASCRIPT. Frontend and also Backend Developement.">
        <meta name="keywords" content="Sumon, Mahmud, Web Developer, Web Designer, Bd Web Developer, Sumon Mahmud">
    
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* color variables */
        :root{
            --primary : #0B0F19;
            --secondary: #111827;
            --PrimaryAccent : #38BDF8;
            --SecondaryAccent: #818CF8;
            --primaryText: #F8FAFC;
            --grayText: #94A3B8;
            --white: #fff;
            
        }


        header{
            
            color: var(--primaryText);
            background-color: var(--primary);
        }

        nav{
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo{
            font-size: 25px;
            font-weight: bolder;
            transition: transform .5s ease;
        }

        .logo:hover{
            transform: scale(1.1);
            color: var(--PrimaryAccent);
            cursor: pointer;
        }

        ul, li,  a{
            color: var(--primaryText);
            display: flex;
            font-size: 20px;
            padding: 10px 12px;
            text-decoration: none;
        }


        a:hover{
            color: var(--PrimaryAccent);
            font-weight: 600;
        }

        .btn-primary{
            border: none;
            padding: 10px 15px;
            border-radius: 15px;
            color: var(--primaryText);
            background-color: var(--PrimaryAccent);
            transition: transform .5s ease;
        }
        .btn-secondary{
            border: none;
            padding: 10px 15px;
            font-size: 12px;
            border-radius: 15px;
            color: var(--primaryText);
            background-color: var(--SecondaryAccent);
            transition: transform .5s ease;
        }

        .btn-primary:hover{
            color: var(--white);
            transform: scale(1.1);
        }

        /* hero section start */
        .hero_section{
            height: 80vh;
            margin: 0 auto;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;

        }

        .left_side, h1, p, button {
            margin-bottom: 15px;
        }

        .left_side h1{
            font-size: 45px;
        }

        .left_side span{
            font-weight: 700;
            color: var(--PrimaryAccent);
        }
      
    </style>
    </head>
    <body>
        <header>
            <nav>
                <div class="logo">
                    Ar Easy Solution
                </div>

                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                    <li><a href="#">Blog</a></li>
                </ul>

                <div class="hire_me">
                    <button class="btn-primary">Hire Me!</button>
                </div>
            </nav>
        </header>
        <!-- end header -->

        <!-- hero section -->
         <section class="hero_section">
            <div class="left_side">
                <p>
                    <span>
                        Create your next Best Website
                    </span>
                </p>
                <h1>
                    Make your Business Easy With Our Services
                </h1>
                <p>
                    Our main aim a to achived make Business Easy or Simple. Manage your Business Easly and Anywhere...
                </p>
                <button class="btn-secondary">Explore</button>
                <button class="btn-secondary">Next?</button>
            </div>
            <div class="right_side">
                <img src="./images/hero_section_right_img.png" alt="" width="600">
            </div>
         </section>
    </body>
</html>
