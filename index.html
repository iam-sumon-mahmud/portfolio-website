    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* color variables */
        :root{
            --primary : #0B0F19;
            --secondary: #111827;
            --PrimaryAccent : #38BDF8;
            --SecondaryAccent: #818CF8;
            --primaryText: #F8FAFC;
            --grayText: #94A3B8;
            --white: #fff;
            
        }


        header{
            
            color: var(--primaryText);
            background-color: var(--primary);
        }

        nav{
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo{
            font-size: 25px;
            font-weight: bolder;
        }

        .logo:hover{
            color: var(--PrimaryAccent);
            cursor: pointer;
        }

        ul, li,  a{
            color: var(--primaryText);
            display: flex;
            font-size: 20px;
            padding: 10px 12px;
            text-decoration: none;
        }


        a:hover{
            color: var(--PrimaryAccent);
            font-weight: 600;
        }

        .btn-primary{
            border: none;
            padding: 12px 15px;
            border-radius: 15px;
            color: var(--primaryText);
            background-color: var(--PrimaryAccent);
            transition: transform .5s ease;
        }

        .btn-primary:hover{
            color: var(--white);
            transform: scale(1.1);
        }
      
    </style>

                </div>
            </nav>

    </body>
